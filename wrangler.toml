# ║  VARIABLES PÚBLICAS                                                ║
# ║  Van aquí para que SOBREVIVAN a cada deployment.                  ║
# ║  ⚠️ SI REPLICAS: cambia estos 3 valores por los de TU proyecto.   ║
# ║                                                                    ║
# ║  La llave privada (FIREBASE_PRIVATE_KEY) NO va aquí porque es     ║
# ║  secreta. Esa se pone como Secret en el dashboard de Cloudflare   ║
# ║  o con: wrangler secret put FIREBASE_PRIVATE_KEY                  ║
# ╚═══════════════════════════════════════════════════════════════════╝
[vars]
FIREBASE_PROJECT_ID = "voluntariando-fd63d"
FIREBASE_CLIENT_EMAIL = "firebase-adminsdk-fbsvc@voluntariando-fd63d.iam.gserviceaccount.com"
